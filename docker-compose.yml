services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/app/static/uploads
      - db-data:/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/install/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web-dist:/usr/share/nginx/web:ro
      - admin-dist:/usr/share/nginx/admin:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  db-data:
  web-dist:
  admin-dist:
